<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Descubrir la Combinación</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="darkModeToggle" aria-label="Cambiar modo oscuro">
        <i data-lucide="moon"></i>
    </button>
    <div class="game-container">
        <h1>Descubre la Combinación</h1>
        <div id="calendar" class="calendar"></div>
        <div class="theme-selector">
            <label for="iconTheme">Tema de iconos:</label>
            <select id="iconTheme">
                <option value="lucide">Lucide Icons</option>
                <option value="emoji">Emojis</option>
            </select>
        </div>
        <div class="difficulty-selector">
            <label for="difficulty">Dificultad:</label>
            <select id="difficulty">
                <option value="3">Fácil (3 iconos)</option>
                <option value="4">Medio (4 iconos)</option>
                <option value="5">Difícil (5 iconos)</option>
            </select>
        </div>
        <div id="gameBoard" class="game-board"></div>
        <div id="iconSelector" class="icon-selector"></div>
        <div class="button-container">
            <button id="undoButton">Deshacer</button>
            <button id="confirmButton">Confirmar</button>
        </div>
        <div id="message" aria-live="polite"></div>
        <div id="remainingAttempts"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
