<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Solitaire Moderno</title>
    <link rel="stylesheet" href="../shared.css"> <!-- Shared styles -->
    <link rel="stylesheet" href="style.css">   <!-- Game-specific styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome for toggle -->
</head>
<body>
    <div class="header-container">
        <a href="../index.html" class="back-to-menu-button">Volver al Menú</a>
        <h1>Mahjong Solitaire</h1>
        <button id="nightModeToggle" aria-label="Change night/day mode"><i class="fas fa-moon"></i></button> <!-- New global button -->
    </div>

    <div class="controls">
        <div class="icon-selector">
            <label for="icon-set-selector">Iconos:</label>
            <select id="icon-set-selector">
                <option value="kanji" selected>Kanji</option>
                <option value="symbols">Símbolos</option>
                <option value="emoji">Emojis</option>
            </select>
        </div>
        <button id="reset-game">Nuevo Juego</button>
         <div id="game-info">
            Pares: <span id="pairs-left">--</span> | Pts: <span id="score">0</span>
        </div>
    </div>

    <div id="game-board-container">
        <div id="game-board">
            <!-- Las fichas se generarán aquí con JavaScript -->
        </div>
    </div>

    <div id="message" class="message hidden"></div>

    <script src="../script.js" defer></script> <!-- Global script -->
    <script src="script.js" defer></script>     <!-- Game-specific script -->
</body>
</html>
