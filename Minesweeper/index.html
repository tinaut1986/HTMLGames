<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Minesweeper</title>
    <link rel="stylesheet" href="../shared.css"> <!-- Shared styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- Keep existing FA -->
    <link rel="stylesheet" href="styles.css">   <!-- Game-specific styles -->
</head>
<body>
    <a href="../index.html" class="back-to-menu-button">Volver al Menú</a>
    <div class="game-container">
        <div class="header">
            <h1>Minesweeper</h1>
            <button id="nightModeToggle" aria-label="Change night/day mode"><i class="fas fa-moon"></i></button> <!-- New global button -->
        </div>
        <div class="controls">
            <select id="difficulty-selector">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="reset-game">
                <i class="fas fa-redo"></i> Restart
            </button>
        </div>
        <div class="game-info">
            <span id="flags-left"><i class="fas fa-flag"></i> <span id="flags-count"></span></span>
            <span id="timer"><i class="fas fa-clock"></i> <span id="time-count">0s</span></span>
        </div>
        <div id="game-board"></div>
        <div id="game-status"></div>
    </div>
    <script src="../script.js" defer></script> <!-- Global script -->
    <script src="script.js" defer></script>     <!-- Game-specific script -->
</body>
</html>
