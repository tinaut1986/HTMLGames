<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <link rel="stylesheet" href="../shared.css"> <!-- Shared styles -->
    <link rel="stylesheet" href="style.css">   <!-- Game-specific styles -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome for toggle -->
</head>
<body>
    <a href="../index.html" class="back-to-menu-button">Volver al Menú</a>
    <div class="game-container">
        <h1>Snake Game</h1>
        <button id="nightModeToggle" aria-label="Change night/day mode"><i class="fas fa-moon"></i></button> <!-- New global button -->
        <div class="controls">
            <label for="difficulty">Dificultad:</label>
            <select id="difficulty">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Medio</option>
                <option value="hard">Difícil</option>
                <option value="insane">Imposible</option>
            </select>
        </div>
        <div class="scores">
            <span>Puntuación: <span id="current-score">0</span></span>
            <span>Máx (<span id="difficulty-label">Medio</span>): <span id="high-score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div id="gameOver" class="game-over-message" style="display: none;">
             ¡Has perdido! Toca/Pulsa Enter para reiniciar.
        </div>
         <div class="mobile-controls">
             <button id="btnUp">▲</button>
             <div>
                 <button id="btnLeft">◀</button>
                 <button id="btnRight">▶</button>
             </div>
             <button id="btnDown">▼</button>
         </div>
    </div>

    <script src="../script.js" defer></script> <!-- Global script -->
    <script src="script.js" defer></script>     <!-- Game-specific script -->
</body>
</html>
